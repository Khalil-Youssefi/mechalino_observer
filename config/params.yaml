/**:
  ros__parameters:
    camera_matrix: [1378.8670120451607, 0.0, 937.0810895286735,
                    0.0, 1379.0715949839703, 561.5996329656532,
                    0.0, 0.0, 1.0]
    dist_coeff: [-0.44422210350101066, 0.2541470051820158,
                0.0014616601794162248, -0.0006275944293412642,
                -0.0850860601858966]
    # Center of the black arena ArUco square in the arena frame. Moving the
    # marker changes this transform, but does not move the coverage grid.
    arena_marker_xy: [0.12, 0.22]
    # topics
    robots_pose_topic: "/robots/pose" # followed by /robot_id
    robots_intern_pose_topic: "/robots/intern_pose" # followed by /robot_id
    arena_pose_topic: "/arena/pose" # not used
    camera_topic: "/camera/raw"
    undistorted_camera_topic: "/camera/undistorted"
    # Shared coverage grid: offsets are the center of cell [0][0]. These must
    # match X0/Y0 in the robot firmware and are independent of the marker pose.
    grid_m: 11
    grid_n: 4
    grid_k: 0.15
    grid_offset_x: 0.18
    grid_offset_y: 0.28

cam2topic:
  ros__parameters:
    camera_index: 4 # v4l2-ctl --list-devices (sudo apt install v4l-utils)
    image_width: 1920
    image_height: 1080

pose_estimator:
  ros__parameters:
    ArUcoDictionary: 0 # DICT_4X4_50
    # Side length of the black ArUco square, excluding paper/white margins.
    ArenaArUcoMarkerSize: 0.16
    MechalinoArUcoMarkerSize: 0.066
    arena_ArUcoID: 0
    cutoff_freq: 1.0
    grid_image_topic: "/arena/grid_image"

odom_publisher:
  ros__parameters:
    odom_publisher_frequency: 2.0
    ip_list_file: "/opt/mechalinos/ip_list.txt"
    http_timeout: 0.5

tf_pose_tcp_server:
  ros__parameters:
    world_frame: "arena"
    robot_frame_prefix: "mechalino_"
    tcp_port: 9000
    max_tcp_clients: 16
    client_idle_timeout_s: 30.0
    max_request_bytes: 256

debug_map_viz:
  ros__parameters:
    debug_url: "http://192.168.50.15/debug"
    robot_frame: "mechalino_15"
    update_period_s: 1.0
    http_timeout_s: 2.0
    obstacle_distance_m: 0.15
    marker_lifetime_s: 2.5
    map_z: 0.01

experiment_supervisor:
  ros__parameters:
    first_robot_id: 15
    robot_frame_prefix: "mechalino_"
    robot_ip_prefix: "192.168.50."
    http_timeout: 2.0
    reset_delay_s: 0.2
    completion_poll_period_s: 1.0
    sample_hz: 10.0
    movement_epsilon: 0.005
    all_experiments_filename: "all_experiments.csv"
    shutdown_on_finish: true
    # Flattened (row, column) pairs. Cell (0, 0) contains the table marker.
    excluded_cells: [0, 0]
